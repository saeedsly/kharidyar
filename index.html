    <script>
      // queueMicrotask is missing from Android 7's Chrome 69 WebView. Some UI
      // dependencies use it before React mounts, so provide the standard fallback early.
      if (typeof window.queueMicrotask !== 'function') {
        window.queueMicrotask = (callback) => {
          Promise.resolve().then(callback).catch((error) => {
            setTimeout(() => { throw error; });
          });
        };
      }
    </script>
