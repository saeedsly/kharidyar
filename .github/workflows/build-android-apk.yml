name: Build Signed Release Android APK & Publish Global Cloud Web App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish-all:
    name: Build Signed APK/AAB & Publish Global Web CDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Production Web Bundle & Sync Capacitor Android
        run: |
          npm ci
          npm run build
          cp dist/assets/index-*.css dist/app.css
          cp dist/assets/index-*.js dist/app.js
          npx cap sync android

      - name: Publish Web Bundle to Global Cloud HTTPS CDN
        run: |
          python3 - << 'PY'
          import os, mimetypes, urllib.request

          SUPABASE_URL = "https://gngrgkrypvrgcnkldbhx.supabase.co"
          ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZ3Jna3J5cHZyZ2Nua2xkYmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTkyNzEsImV4cCI6MjEwODI3NTI3MX0.uHp5_u0ASWy5P0BVjppDC1h4MdXJ-0KgqJl_JkwSMQI"

          MIME_OVERRIDES = {
              ".js": "application/javascript",
              ".mjs": "application/javascript",
              ".css": "text/css",
              ".wasm": "application/wasm",
              ".gz": "application/gzip",
              ".woff2": "font/woff2",
              ".png": "image/png",
              ".jpg": "image/jpeg",
              ".json": "application/json",
              ".html": "text/html; charset=utf-8",
          }

          uploaded = 0
          for root, _, files in os.walk("dist"):
              for fname in files:
                  full_path = os.path.join(root, fname)
                  rel_path = os.path.relpath(full_path, "dist").replace("\\", "/")
                  ext = os.path.splitext(fname)[1].lower()
                  ctype = MIME_OVERRIDES.get(ext) or mimetypes.guess_type(fname)[0] or "application/octet-stream"
                  with open(full_path, "rb") as f:
                      body = f.read()
                  req = urllib.request.Request(
                      f"{SUPABASE_URL}/storage/v1/object/web-cdn/{rel_path}",
                      data=body,
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {ANON_KEY}",
                          "apikey": ANON_KEY,
                          "Content-Type": ctype,
                          "x-upsert": "true",
                          "Cache-Control": "3600",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      assert resp.status in (200, 201), f"Upload failed for {rel_path}: {resp.status}"
                  uploaded += 1
          print(f"Uploaded {uploaded} production files to Global Cloud CDN!")
          PY

      - name: Generate Official RSA-2048 Release Keystore & Assemble Signed APK + Play Store AAB
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore kharidyar-release.jks \
            -alias kharidyar_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KharidYarSaeedSalari2026 \
            -keypass KharidYarSaeedSalari2026 \
            -dname "CN=Saeed Salari, OU=KharidYar Product Engineering, O=Saeed Salari, L=Madrid, ST=Madrid, C=ES"

          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PKHARIDYAR_STORE_FILE="$PWD/kharidyar-release.jks" \
            -PKHARIDYAR_STORE_PASSWORD=KharidYarSaeedSalari2026 \
            -PKHARIDYAR_KEY_ALIAS=kharidyar_release \
            -PKHARIDYAR_KEY_PASSWORD=KharidYarSaeedSalari2026

          cp app/build/outputs/apk/release/app-release.apk ../KharidYar-v1.0.apk
          cp app/build/outputs/bundle/release/app-release.aab ../KharidYar-PlayStore.aab

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --print-certs ../KharidYar-v1.0.apk

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Signed-Release-Packages
          path: |
            KharidYar-v1.0.apk
            KharidYar-PlayStore.aab
          if-no-files-found: error

      - name: Publish Signed APK & Google Play AAB to Public Release (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "خریدیـار (KharidYar) — نسخه رسمی امضاشده اندروید و Google Play" \
            --notes "طراحی، توسعه و مالکیت انحصاری اثر: سعید سالاری (Saeed Salari) — https://www.linkedin.com/in/saeed-salariy/"
          gh release upload v1.0.0 KharidYar-v1.0.apk KharidYar-PlayStore.aab --clobber

      - name: Verify All Live Public Internet URLs Return HTTP 200
        run: |
          curl -fsSI "https://raw.githack.com/saeedsly/kharidyar/${{ github.ref_name }}/public/online.html" | head -n 5
          curl -fsSI "https://raw.githack.com/saeedsly/kharidyar/${{ github.ref_name }}/public/privacy.html" | head -n 5
          curl -fsSI "https://gngrgkrypvrgcnkldbhx.supabase.co/storage/v1/object/public/web-cdn/app.js" | head -n 5
