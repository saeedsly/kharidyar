name: Build Signed Release Android APK & Publish Global Cloud Web App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish-all:
    name: Build Android 7 Compatible APK & Publish Global Web CDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Production Web Bundle & Sync Capacitor Android
        run: |
          npm ci
          npm run build
          cp dist/assets/index-*.css dist/app.css
          cp dist/assets/index-*.js dist/app.js
          npx cap sync android

      - name: Publish Web Bundle to Global Cloud HTTPS CDN
        run: |
          python3 - << 'PY'
          import os, mimetypes, urllib.request

          SUPABASE_URL = "https://gngrgkrypvrgcnkldbhx.supabase.co"
          ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZ3Jna3J5cHZyZ2Nua2xkYmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTkyNzEsImV4cCI6MjEwODI3NTI3MX0.uHp5_u0ASWy5P0BVjppDC1h4MdXJ-0KgqJl_JkwSMQI"

          MIME_OVERRIDES = {
              ".js": "application/javascript",
              ".mjs": "application/javascript",
              ".css": "text/css",
              ".wasm": "application/wasm",
              ".gz": "application/gzip",
              ".woff2": "font/woff2",
              ".png": "image/png",
              ".jpg": "image/jpeg",
              ".json": "application/json",
              ".html": "text/html; charset=utf-8",
          }

          uploaded = 0
          for root, _, files in os.walk("dist"):
              for fname in files:
                  full_path = os.path.join(root, fname)
                  rel_path = os.path.relpath(full_path, "dist").replace("\\", "/")
                  ext = os.path.splitext(fname)[1].lower()
                  ctype = MIME_OVERRIDES.get(ext) or mimetypes.guess_type(fname)[0] or "application/octet-stream"
                  with open(full_path, "rb") as f:
                      body = f.read()
                  req = urllib.request.Request(
                      f"{SUPABASE_URL}/storage/v1/object/web-cdn/{rel_path}",
                      data=body,
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {ANON_KEY}",
                          "apikey": ANON_KEY,
                          "Content-Type": ctype,
                          "x-upsert": "true",
                          "Cache-Control": "3600",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      assert resp.status in (200, 201), f"Upload failed for {rel_path}: {resp.status}"
                  uploaded += 1
          print(f"Uploaded {uploaded} production files to Global Cloud CDN!")
          PY

      - name: Build Aligned Android 7 Legacy APK, Modern APK & Play Store AAB
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore kharidyar-release.jks \
            -alias kharidyar_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KharidYarSaeedSalari2026 \
            -keypass KharidYarSaeedSalari2026 \
            -dname "CN=Saeed Salari, OU=KharidYar Product Engineering, O=Saeed Salari, L=Madrid, ST=Madrid, C=ES"

          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PKHARIDYAR_STORE_FILE="$PWD/kharidyar-release.jks" \
            -PKHARIDYAR_STORE_PASSWORD=KharidYarSaeedSalari2026 \
            -PKHARIDYAR_KEY_ALIAS=kharidyar_release \
            -PKHARIDYAR_KEY_PASSWORD=KharidYarSaeedSalari2026

          ZIPALIGN_BIN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          APK_IN="app/build/outputs/apk/release/app-release.apk"

          # Both installers start from the same single, aligned (non-split) APK.
          "$ZIPALIGN_BIN" -f -p 4 "$APK_IN" ../KharidYar-Aligned.apk

          # Modern universal APK: v1 + v2 + v3 signatures.
          "$APKSIGNER_BIN" sign \
            --ks "$PWD/kharidyar-release.jks" \
            --ks-key-alias kharidyar_release \
            --ks-pass pass:KharidYarSaeedSalari2026 \
            --key-pass pass:KharidYarSaeedSalari2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../KharidYar-Universal-v1.4.1.apk \
            ../KharidYar-Aligned.apk

          # Legacy universal APK: JAR/v1 signature only. Some older vendor installers (Android 5.1-7) handle this path more reliably.
          "$APKSIGNER_BIN" sign \
            --ks "$PWD/kharidyar-release.jks" \
            --ks-key-alias kharidyar_release \
            --ks-pass pass:KharidYarSaeedSalari2026 \
            --key-pass pass:KharidYarSaeedSalari2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled false \
            --v3-signing-enabled false \
            --out ../KharidYar-Android7-v1.4.1.apk \
            ../KharidYar-Aligned.apk

          cp app/build/outputs/bundle/release/app-release.aab ../KharidYar-PlayStore-v1.4.1.aab

          # Validate the old-Android APK using the v1 verification path, and validate the modern one separately.
          "$APKSIGNER_BIN" verify -v --min-sdk-version 22 --max-sdk-version 23 --print-certs ../KharidYar-Android7-v1.4.1.apk
          "$APKSIGNER_BIN" verify -v --min-sdk-version 24 --max-sdk-version 35 --print-certs ../KharidYar-Universal-v1.4.1.apk

      - name: Publish Android 7 APK to Public HTTPS CDN
        run: |
          python3 - << 'PY'
          import os, urllib.request

          supabase_url = "https://gngrgkrypvrgcnkldbhx.supabase.co"
          anon_key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZ3Jna3J5cHZyZ2Nua2xkYmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTkyNzEsImV4cCI6MjEwODI3NTI3MX0.uHp5_u0ASWy5P0BVjppDC1h4MdXJ-0KgqJl_JkwSMQI"
          local_path = "KharidYar-Android7-v1.4.1.apk"
          remote_path = "downloads/KharidYar-Android7-v1.4.1.apk"
          with open(local_path, "rb") as f:
              req = urllib.request.Request(
                  f"{supabase_url}/storage/v1/object/web-cdn/{remote_path}",
                  data=f.read(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {anon_key}",
                      "apikey": anon_key,
                      "Content-Type": "application/vnd.android.package-archive",
                      "Content-Length": str(os.path.getsize(local_path)),
                      "x-upsert": "true",
                      "Cache-Control": "public, max-age=300",
                  },
              )
          with urllib.request.urlopen(req, timeout=120) as resp:
              print(f"Android 7 APK CDN upload: HTTP {resp.status}")
              assert resp.status in (200, 201)
          PY

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Android-Release-v1.4.1
          path: |
            KharidYar-Android7-v1.4.1.apk
            KharidYar-Universal-v1.4.1.apk
            KharidYar-PlayStore-v1.4.1.aab
          if-no-files-found: error

      - name: Publish Signed Packages to Public Release (v1.4.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.4.1 >/dev/null 2>&1 || gh release create v1.4.1 \
            --title "خریدیـار 1.4.1 — نصب سازگار با اندروید 7 و بالاتر" \
            --notes "نسخه تست نصب اندروید: Android 7 legacy APK با امضای v1، نسخه Universal مدرن با v1/v2/v3، و فایل AAB. صاحب اثر: سعید سالاری."
          gh release upload v1.4.1 \
            KharidYar-Android7-v1.4.1.apk \
            KharidYar-Universal-v1.4.1.apk \
            KharidYar-PlayStore-v1.4.1.aab --clobber

      - name: Verify Public Download URLs
        run: |
          curl -fsSI "https://gngrgkrypvrgcnkldbhx.supabase.co/storage/v1/object/public/web-cdn/downloads/KharidYar-Android7-v1.4.1.apk" | head -n 5
          curl -fsSI "https://github.com/saeedsly/kharidyar/releases/download/v1.4.1/KharidYar-Android7-v1.4.1.apk" | head -n 5
          curl -fsSI "https://gngrgkrypvrgcnkldbhx.supabase.co/storage/v1/object/public/web-cdn/app.js" | head -n 5
