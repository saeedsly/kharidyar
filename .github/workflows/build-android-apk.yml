name: Build Signed Release Android APK & Publish Public Web App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk-and-aab:
    name: Build Signed Production APK & Google Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies & Bundle Persian OCR Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Generate Official RSA-2048 Production Keystore & Build Signed APK + Play Store AAB
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore kharidyar-release.jks \
            -alias kharidyar_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KharidYarSaeedSalari2026 \
            -keypass KharidYarSaeedSalari2026 \
            -dname "CN=Saeed Salari, OU=KharidYar Product Engineering, O=Saeed Salari, L=Madrid, ST=Madrid, C=ES"

          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PKHARIDYAR_STORE_FILE="$PWD/kharidyar-release.jks" \
            -PKHARIDYAR_STORE_PASSWORD=KharidYarSaeedSalari2026 \
            -PKHARIDYAR_KEY_ALIAS=kharidyar_release \
            -PKHARIDYAR_KEY_PASSWORD=KharidYarSaeedSalari2026

          cp app/build/outputs/apk/release/app-release.apk ../KharidYar-v1.0.apk
          cp app/build/outputs/bundle/release/app-release.aab ../KharidYar-PlayStore.aab

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --print-certs ../KharidYar-v1.0.apk

      - name: Upload Signed Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Signed-Release-Packages
          path: |
            KharidYar-v1.0.apk
            KharidYar-PlayStore.aab
          if-no-files-found: error

      - name: Publish Signed APK & Google Play AAB to Public Release (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "خریدیـار (KharidYar) — نسخه رسمی امضاشده اندروید و Google Play" \
            --notes "طراحی، توسعه و مالکیت انحصاری اثر: سعید سالاری (Saeed Salari) — https://www.linkedin.com/in/saeed-salariy/"
          gh release upload v1.0.0 KharidYar-v1.0.apk KharidYar-PlayStore.aab --clobber

  publish-public-web:
    name: Deploy Public Web App (GitHub Pages Global HTTPS)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build Public Production Web Bundle
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure & Auto-Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Public Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages Global CDN
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Live Public HTTPS URLs
        run: |
          echo "Deployed Live URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 4
          curl -sI "${{ steps.deployment.outputs.page_url }}" | head -n 8
          curl -sI "${{ steps.deployment.outputs.page_url }}privacy.html" | head -n 8
