name: Build offline Android APK

on:
  push:
    branches:
      - arena/6332d18e-kharidyar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable offline APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build offline web assets and sync Capacitor
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Prepare APK signing key
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KHARIDYAR_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KHARIDYAR_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KHARIDYAR_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KHARIDYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store_file="$RUNNER_TEMP/kharidyar-release.jks"

          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$store_file"
            store_password="$RELEASE_STORE_PASSWORD"
            key_alias="$RELEASE_KEY_ALIAS"
            key_password="$RELEASE_KEY_PASSWORD"
            mode="stable-key"
          else
            store_file="$RUNNER_TEMP/kharidyar-test-only.jks"
            store_password="$(openssl rand -hex 32)"
            key_alias="kharidyar_test_only"
            key_password="$store_password"
            keytool -genkeypair -noprompt \
              -keystore "$store_file" \
              -storetype JKS \
              -alias "$key_alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -dname "CN=KharidYar temporary test build"
            mode="test-only-key"
            echo "No persistent signing-key secrets configured; this APK is for a fresh test install only."
          fi

          {
            echo "KHARIDYAR_STORE_FILE=$store_file"
            echo "KHARIDYAR_STORE_PASSWORD=$store_password"
            echo "KHARIDYAR_KEY_ALIAS=$key_alias"
            echo "KHARIDYAR_KEY_PASSWORD=$key_password"
            echo "KHARIDYAR_SIGNING_MODE=$mode"
          } >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Assemble signed APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          version_code=$((7 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PKHARIDYAR_VERSION_CODE="$version_code"
          mkdir -p ../apk-output
          cp app/build/outputs/apk/release/app-release.apk \
            "../apk-output/KharidYar-Android-v1.4.3-${KHARIDYAR_SIGNING_MODE}.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose apk-output/*.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Android-v1.4.3-${{ steps.signing.outputs.mode }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
