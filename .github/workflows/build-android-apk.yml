name: Build Signed Release Android APK & Publish Global Cloud Web App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish-all:
    name: Publish Web App & Build Stable-Signed Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Production Web Bundle & Sync Capacitor Android
        run: |
          npm ci
          npm run build
          cp dist/assets/index-*.css dist/app.css
          cp dist/assets/index-*.js dist/app.js
          npx cap sync android

      - name: Publish Web Bundle to Global Cloud HTTPS CDN
        run: |
          python3 - << 'PY'
          import os, mimetypes, urllib.request

          SUPABASE_URL = "https://gngrgkrypvrgcnkldbhx.supabase.co"
          ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZ3Jna3J5cHZyZ2Nua2xkYmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTkyNzEsImV4cCI6MjEwODI3NTI3MX0.uHp5_u0ASWy5P0BVjppDC1h4MdXJ-0KgqJl_JkwSMQI"

          MIME_OVERRIDES = {
              ".js": "application/javascript",
              ".mjs": "application/javascript",
              ".css": "text/css",
              ".wasm": "application/wasm",
              ".gz": "application/gzip",
              ".woff2": "font/woff2",
              ".png": "image/png",
              ".jpg": "image/jpeg",
              ".json": "application/json",
              ".html": "text/html; charset=utf-8",
          }

          uploaded = 0
          for root, _, files in os.walk("dist"):
              for fname in files:
                  full_path = os.path.join(root, fname)
                  rel_path = os.path.relpath(full_path, "dist").replace("\\", "/")
                  ext = os.path.splitext(fname)[1].lower()
                  ctype = MIME_OVERRIDES.get(ext) or mimetypes.guess_type(fname)[0] or "application/octet-stream"
                  with open(full_path, "rb") as f:
                      body = f.read()
                  req = urllib.request.Request(
                      f"{SUPABASE_URL}/storage/v1/object/web-cdn/{rel_path}",
                      data=body,
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {ANON_KEY}",
                          "apikey": ANON_KEY,
                          "Content-Type": ctype,
                          "x-upsert": "true",
                          "Cache-Control": "300",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      assert resp.status in (200, 201), f"Upload failed for {rel_path}: {resp.status}"
                  uploaded += 1
          print(f"Uploaded {uploaded} production web files to the public CDN.")
          PY

      # APKs must keep one signing certificate between releases. The previous pipeline generated a
      # different key on each run, which breaks Android updates. Until a persistent key is stored in
      # GitHub Actions Secrets, publish the web update but do not overwrite the installable APK.
      - name: Restore persistent Android release keystore
        id: restore-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KHARIDYAR_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KHARIDYAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KHARIDYAR_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Persistent Android signing secrets are not configured; keeping the existing APK release unchanged."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/kharidyar-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build aligned Android 7 Legacy APK, Modern APK & Play Store AAB
        if: steps.restore-signing.outputs.ready == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.restore-signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.KHARIDYAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KHARIDYAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KHARIDYAR_KEY_PASSWORD }}
        run: |
          test -n "$KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PKHARIDYAR_STORE_FILE="$KEYSTORE_PATH" \
            -PKHARIDYAR_STORE_TYPE=PKCS12 \
            -PKHARIDYAR_STORE_PASSWORD="$STORE_PASSWORD" \
            -PKHARIDYAR_KEY_ALIAS="$KEY_ALIAS" \
            -PKHARIDYAR_KEY_PASSWORD="$KEY_PASSWORD"

          ZIPALIGN_BIN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          APK_IN="app/build/outputs/apk/release/app-release.apk"
          "$ZIPALIGN_BIN" -f -p 4 "$APK_IN" ../KharidYar-Aligned.apk

          "$APKSIGNER_BIN" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../KharidYar-Universal-v1.4.2.apk \
            ../KharidYar-Aligned.apk

          "$APKSIGNER_BIN" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled false \
            --v3-signing-enabled false \
            --out ../KharidYar-Android7-v1.4.2.apk \
            ../KharidYar-Aligned.apk

          cp app/build/outputs/bundle/release/app-release.aab ../KharidYar-PlayStore-v1.4.2.aab
          "$APKSIGNER_BIN" verify -v --min-sdk-version 22 --max-sdk-version 23 --print-certs ../KharidYar-Android7-v1.4.2.apk
          "$APKSIGNER_BIN" verify -v --min-sdk-version 24 --max-sdk-version 35 --print-certs ../KharidYar-Universal-v1.4.2.apk

      - name: Publish Android APKs to Public HTTPS CDN
        if: steps.restore-signing.outputs.ready == 'true'
        env:
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZ3Jna3J5cHZyZ2Nua2xkYmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTkyNzEsImV4cCI6MjEwODI3NTI3MX0.uHp5_u0ASWy5P0BVjppDC1h4MdXJ-0KgqJl_JkwSMQI"
        run: |
          python3 - << 'PY'
          import os, urllib.request
          supabase_url = "https://gngrgkrypvrgcnkldbhx.supabase.co"
          anon_key = os.environ["SUPABASE_ANON_KEY"]
          for local_path, remote_path in [
              ("KharidYar-Android7-v1.4.2.apk", "downloads/KharidYar-Android7-v1.4.2.apk"),
              ("KharidYar-Android7-v1.4.2.apk", "downloads/KharidYar-Android7.apk"),
          ]:
              with open(local_path, "rb") as f:
                  payload = f.read()
              req = urllib.request.Request(
                  f"{supabase_url}/storage/v1/object/web-cdn/{remote_path}",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {anon_key}",
                      "apikey": anon_key,
                      "Content-Type": "application/vnd.android.package-archive",
                      "x-upsert": "true",
                      "Cache-Control": "public, max-age=300",
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  assert resp.status in (200, 201)
                  print(f"Uploaded {remote_path}: HTTP {resp.status}")
          PY

      - name: Upload Signed Release Artifacts
        if: steps.restore-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Android-Release-v1.4.2
          path: |
            KharidYar-Android7-v1.4.2.apk
            KharidYar-Universal-v1.4.2.apk
            KharidYar-PlayStore-v1.4.2.aab
          if-no-files-found: error

      - name: Publish Signed Packages to Public Release (v1.4.2)
        if: steps.restore-signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.4.2 >/dev/null 2>&1 || gh release create v1.4.2 \
            --title "خریدیـار 1.4.2 — پردازش فاکتور سریع‌تر روی اندرویدهای قدیمی" \
            --notes "پردازش تصویر کم‌حافظه و APK با امضای پایدار. صاحب اثر: سعید سالاری."
          gh release upload v1.4.2 \
            KharidYar-Android7-v1.4.2.apk \
            KharidYar-Universal-v1.4.2.apk \
            KharidYar-PlayStore-v1.4.2.aab --clobber

      - name: Verify Public Web App URL
        run: |
          curl -fsSI "https://gngrgkrypvrgcnkldbhx.supabase.co/storage/v1/object/public/web-cdn/app.js" | head -n 5

      - name: Verify Android APK CDN URL
        if: steps.restore-signing.outputs.ready == 'true'
        run: |
          curl -fsSI "https://gngrgkrypvrgcnkldbhx.supabase.co/storage/v1/object/public/web-cdn/downloads/KharidYar-Android7-v1.4.2.apk" | head -n 5
