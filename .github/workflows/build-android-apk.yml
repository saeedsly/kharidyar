name: Build KharidYar Android APK

on:
  push:
    branches:
      - arena/6332d18e-kharidyar
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: Publish the APK as a public test pre-release with a direct download link
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable offline APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Using Android SDK at $ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -n "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print -quit)"

      - name: Build offline web assets and sync Capacitor
        run: |
          npm ci --no-audit --no-fund
          npm run test:ocr-space-client
          npm run test:ocr-space-function
          npm run test:ocr-parser
          npm run test:ocr-image-processing
          npx tsc --noEmit
          npm run build
          npx cap sync android

      - name: Prepare APK signing key
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KHARIDYAR_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KHARIDYAR_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KHARIDYAR_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KHARIDYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store_file="$RUNNER_TEMP/kharidyar-release.jks"

          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$store_file"
            store_password="$RELEASE_STORE_PASSWORD"
            key_alias="$RELEASE_KEY_ALIAS"
            key_password="$RELEASE_KEY_PASSWORD"
            mode="stable-key"
          else
            store_file="$RUNNER_TEMP/kharidyar-test-only.jks"
            store_password="$(openssl rand -hex 32)"
            key_alias="kharidyar_test_only"
            key_password="$store_password"
            keytool -genkeypair -noprompt \
              -keystore "$store_file" \
              -storetype JKS \
              -alias "$key_alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -dname "CN=KharidYar temporary test build"
            mode="test-only-key"
            echo "No persistent signing-key secrets configured; this APK is for a fresh test install only."
          fi

          {
            echo "KHARIDYAR_STORE_FILE=$store_file"
            echo "KHARIDYAR_STORE_PASSWORD=$store_password"
            echo "KHARIDYAR_KEY_ALIAS=$key_alias"
            echo "KHARIDYAR_KEY_PASSWORD=$key_password"
            echo "KHARIDYAR_SIGNING_MODE=$mode"
          } >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Assemble signed APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          version_code=$((7 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PKHARIDYAR_VERSION_CODE="$version_code"
          mkdir -p ../apk-output
          cp app/build/outputs/apk/release/app-release.apk \
            "../apk-output/KharidYar-Android-v1.4.6-${KHARIDYAR_SIGNING_MODE}.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose apk-output/*.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Android-v1.4.6-${{ steps.signing.outputs.mode }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-test-release:
    name: Publish public test APK download
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_test_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-test-release]'))
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          path: downloaded-apk

      - name: Publish labeled test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "No APK was found in the build artifact."
            exit 1
          fi

          tag="android-test-${GITHUB_RUN_ID}"
          notes_file="$RUNNER_TEMP/test-release-notes.md"
          cat > "$notes_file" <<EOF
          **Test build only — not an official stable release.**

          This APK is provided for manual testing. It was built from commit ${GITHUB_SHA}.
          Android capture uses the native camera again; the in-preview framing box has been removed. Both cloud and offline receipt OCR use only the Persian FAS model; English and Turkish OCR options are removed.
          Optional OCR.space Engine 3 is used only when the user enables cloud OCR and the Supabase function reports configured; otherwise the app falls back locally. The OCR.space API key is not embedded in this APK. This build has not been live-tested against the cloud OCR provider.
          Persian/Arabic letter variants and digits are normalized locally; when cloud OCR is disabled or unavailable, receipt text is read by the on-device engine. The high-contrast Otsu option is experimental and has not been validated against native OCR.
          The camera flow has not yet been verified on a physical handset.
          This pre-release does not certify OCR accuracy; review the extracted items and totals before saving.
          Check the Android 7 API 24 workflow for this app source before relying on offline OCR results.
          The APK may use a temporary signing key and may not update an existing installation signed with another key.
          EOF

          gh release create "$tag" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KharidYar Android test APK (${GITHUB_RUN_ID})" \
            --notes-file "$notes_file" \
            --prerelease

          release_page="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$apk_path")"
          {
            echo "### Test APK download"
            echo "Release page: ${release_page}"
            echo "Direct APK: ${download_url}"
          } >> "$GITHUB_STEP_SUMMARY"
