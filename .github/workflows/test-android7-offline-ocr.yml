name: Test offline OCR on Android 7 emulator

on:
  push:
    branches:
      - arena/6332d18e-kharidyar
    paths-ignore:
      - .github/workflows/build-android-apk.yml
      - .github/workflows/test-android7-offline-ocr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api24-ocr:
    name: Run bundled receipt OCR on API 24
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools and emulator
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'

      - name: Verify Android SDK
        run: |
          echo "Using Android SDK at $ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          command -v sdkmanager
          test -x "$ANDROID_HOME/emulator/emulator"

      - name: Build local OCR assets
        run: |
          npm ci --no-audit --no-fund
          npm run test:ocr-parser
          npm run build
          npx cap sync android

      - name: Run OCR test in Android 7 emulator with network disabled
        id: android7_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          working-directory: android
          # The action runs each input line separately, so keep status capture in one folded shell command.
          script: >-
            adb shell svc wifi disable >/dev/null 2>&1 || true;
            adb shell svc data disable >/dev/null 2>&1 || true;
            ./gradlew --no-daemon :app:connectedDebugAndroidTest > ../emulator-test.log 2>&1;
            test_status=$?;
            cat ../emulator-test.log;
            printf '\nANDROID_TEST_GRADLE_EXIT_CODE=%s\n' "$test_status" | tee -a ../emulator-test.log;
            adb logcat -d -v threadtime '*:E' OfflineOcrAssets:V AndroidRuntime:E > ../emulator-logcat.txt || true;
            exit "$test_status"

      - name: Summarize emulator OCR result
        if: always()
        env:
          OCR_TEST_OUTCOME: ${{ steps.android7_test.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import html
          import os
          import xml.etree.ElementTree as ET

          outcome = os.environ.get('OCR_TEST_OUTCOME', 'unknown')
          paths = glob.glob('android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          paths += glob.glob('android/app/build/test-results/**/*.xml', recursive=True)
          failures = []
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      detail = failure.get('message') or failure.text or 'Instrumentation test failed'
                      failures.append(f"{case.get('name', 'OCR test')}: {detail}")

          if outcome == 'success':
              message = 'PASS: bundled short and 48-item thermal receipt OCR completed on Android 7 API 24 with Wi-Fi and mobile data disabled.'
              if os.path.isfile('emulator-test.log'):
                  with open('emulator-test.log', encoding='utf-8', errors='replace') as log_file:
                      details = ' '.join(
                          line.strip() for line in log_file
                          if 'OFFLINE_OCR_FILE_PICKER_PASS:' in line or 'OFFLINE_OCR_EMULATOR_PASS:' in line or 'OFFLINE_OCR_LONG_THERMAL_PASS:' in line
                      )
                  if details:
                      message += ' ' + details
              print('::notice title=Android 7 offline OCR::' + message)
              summary = '## Android 7 offline OCR emulator test\n\n' + message + '\n'
          else:
              if failures:
                  message = ' | '.join(failures)
              else:
                  message = f'Emulator test outcome: {outcome}. No JUnit failure details were produced.'
              if os.path.isfile('emulator-test.log'):
                  with open('emulator-test.log', encoding='utf-8', errors='replace') as log_file:
                      log_lines = log_file.read().splitlines()
                  exit_codes = [line.strip() for line in log_lines if line.startswith('ANDROID_TEST_GRADLE_EXIT_CODE=')]
                  if exit_codes:
                      message += ' ' + exit_codes[-1]
                  log_tail = '\n'.join(log_lines[-30:])
                  if log_tail:
                      message += f' Gradle output: {log_tail}'
              if os.path.isfile('emulator-logcat.txt'):
                  with open('emulator-logcat.txt', encoding='utf-8', errors='replace') as log_file:
                      logcat_tail = '\n'.join(log_file.read().splitlines()[-30:])
                  if logcat_tail:
                      message += f' Android logcat: {logcat_tail}'
              if len(message) > 5000:
                  message = message[:1000] + '\n[log excerpt trimmed]\n' + message[-3900:]
              message = html.escape(message).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android 7 offline OCR::' + message)
              summary = '## Android 7 offline OCR emulator test — FAILED\n\n' + message + '\n'
          with open('emulator-summary.md', 'w', encoding='utf-8') as out:
              out.write(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(summary)
          PY

      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Android7-OCR-test-report
          path: |
            emulator-test.log
            emulator-logcat.txt
            emulator-summary.md
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
