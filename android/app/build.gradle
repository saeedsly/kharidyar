apply plugin: 'com.android.application'

def signingStoreFile = project.findProperty('KHARIDYAR_STORE_FILE') ?: System.getenv('KHARIDYAR_STORE_FILE')
def signingStorePassword = project.findProperty('KHARIDYAR_STORE_PASSWORD') ?: System.getenv('KHARIDYAR_STORE_PASSWORD')
def signingKeyAlias = project.findProperty('KHARIDYAR_KEY_ALIAS') ?: System.getenv('KHARIDYAR_KEY_ALIAS')
def signingKeyPassword = project.findProperty('KHARIDYAR_KEY_PASSWORD') ?: System.getenv('KHARIDYAR_KEY_PASSWORD')
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword]
        .every { it != null && !it.toString().trim().isEmpty() }
def releaseVersionCode = (project.findProperty('KHARIDYAR_VERSION_CODE') ?: '7').toString().toInteger()

android {
    namespace "com.saeedsalari.kharidyar"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.saeedsalari.kharidyar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName "1.4.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStoreFile.toString())
                storePassword signingStorePassword.toString()
                keyAlias signingKeyAlias.toString()
                keyPassword signingKeyPassword.toString()
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
